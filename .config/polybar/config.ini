[settings]
screenchange-reload = true
pseudo-transparency = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Colors & Aesthetics
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[colors]
background = #EBE5D9
foreground = #5C6A72
accent = #8A9A9A
alert = #C4746E
disabled = #8A9A9A

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Bar Templates
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/base]
width = 100%
height = 26
offset-x = 0
offset-y = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 1
padding-right = 2
module-margin = 2

; Font configuration: A clean sans-serif and a pixel font
font-0 = "Iosevka Nerd Font:size=10;2"
font-1 = "Terminus:size=10;2"
font-2 = "Spleen:size=10;2"

modules-left = i3
modules-center = date
modules-right = cpu memory volume battery

cursor-click = pointer
cursor-scroll = ns-resize

tray-padding = 2
tray-background = ${colors.background}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Specific Bar Definitions
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/film]
inherit = bar/base
monitor = FILM
tray-position = right

[bar/work-left]
inherit = bar/base
monitor = DP-4
tray-position = none

[bar/work-center]
inherit = bar/base
monitor = DP-0
tray-position = right ; Tray on primary monitor

[bar/work-right]
inherit = bar/base
monitor = DP-2
tray-position = none

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Module Definitions
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true

enable-click = true
enable-scroll = false
wrapping-scroll = false

; Use the pixel font for workspace numbers
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-default = 

format = <label-state> <label-mode>
label-mode-padding = 1
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.background}

label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-padding = 2
label-focused-foreground = ${colors.background}

label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.disabled}

label-visible = %index%
label-visible-background = #C8C8C8
label-visible-padding = 2
label-visible-foreground = ${colors.foreground}

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-urgent-foreground = ${colors.background}

[module/date]
type = internal/date
interval = 5

date = %Y-%m-%d
time = %H:%M

format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${colors.accent}
label = " %date% %time%"

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${colors.accent}
label = " %percentage:2%%"

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${colors.accent}
label = " %percentage_used%%"

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = " %percentage%%"

format-muted-prefix = " "
format-muted-prefix-font = 3
format-muted-foreground = ${colors.disabled}
label-muted = " Muted"

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}
ramp-volume-font = 3

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.accent}

label-charging = " %percentage%%"
label-discharging = " %percentage%%"
label-full = " Full"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}
ramp-capacity-font = 3

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.accent}
animation-charging-font = 3
animation-charging-framerate = 750
