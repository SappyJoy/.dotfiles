[settings]
screenchange-reload = true
pseudo-transparency = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Colors & Aesthetics (Ayu Light)
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[colors]
background = #FAFAFA
background-alt = #F3F4F5
foreground = #5C6A72
primary = #FA8D3E
secondary = #8295A6
alert = #F07178
disabled = #ABB0B6

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Bar Templates
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/base]
; --- The Critical Fix for True Floating ---
override-redirect = true

; --- Floating Bar Geometry ---
width = 99.6%
height = 24
offset-y = 5
offset-x = 0.2%
fixed-center = true

; --- Aesthetics ---
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 2
border-color = ${colors.background} ; Creates an invisible margin for modules

padding-left = 1
padding-right = 2
module-margin = 2

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Iosevka Nerd Font:size=11;3"
font-1 = "Iosevka Nerd Font:size=14;4"

modules-left = i3
modules-center = date
modules-right = filesystem pulseaudio memory cpu battery powermenu

cursor-click = pointer
cursor-scroll = ns-resize

; --- Correct Tray Settings for Floating Bar ---
tray-position = right
tray-padding = 5
tray-background = ${colors.background}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Specific Bar Definitions (Unchanged)
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/film]
inherit = bar/base
monitor = FILM
tray-position = right

[bar/work-left]
inherit = bar/base
monitor = DP-4
tray-position = none

[bar/work-center]
inherit = bar/base
monitor = DP-0
tray-position = right

[bar/work-right]
inherit = bar/base
monitor = DP-2
tray-position = none

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Module Definitions
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

ws-icon-default = 

format = <label-state> <label-mode>
label-mode-padding = 1
label-mode-background = ${colors.primary}
label-mode-foreground = ${colors.background}

label-focused = %index%
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.disabled}

label-visible = %index%
label-visible-underline = ${colors.disabled}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a, %d %b
time = %H:%M
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = " %date% %time%"

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted =  %free%
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>
label-volume = %percentage%%
use-ui-max = false
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
ramp-volume-font = 2
label-muted =  muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
format-full-prefix = " "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.primary}
label-full = Full
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-font = 2
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.primary}
animation-charging-font = 2
animation-charging-framerate = 750

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = 
label-open-foreground = ${colors.primary}
label-close = 
label-close-foreground = ${colors.primary}
label-separator = |
label-separator-foreground = ${colors.disabled}
menu-0-0 = " Reboot "
menu-0-0-exec = menu-open-1
menu-0-1 = " Poweroff "
menu-0-1-exec = menu-open-2
menu-1-0 = "Cancel"
menu-1-0-exec = menu-open-0
menu-1-1 = "Reboot"
menu-1-1-exec = reboot
menu-2-0 = "Poweroff"
menu-2-0-exec = poweroff
menu-2-1 = "Cancel"
menu-2-1-exec = menu-open-0

[module/network]
type = internal/network
interface-type = all
interval = 3.0

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%

format-disconnected = <label-disconnected>
label-disconnected = Not connected
label-disconnected-foreground = ${colors.disabled}
